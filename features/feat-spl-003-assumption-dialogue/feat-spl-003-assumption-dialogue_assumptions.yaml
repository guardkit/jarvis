  - id: "ASSUM-007"
    scenario: "A planned handoff notification is rendered into the originating thread"
    assumption: >-
      The jarvis.notification.slack consumer is a NAMED DURABLE consumer on
      the JARVIS stream (limits retention, so no workqueue-overlap hazard),
      created with deliver_policy=ALL on first creation, so a restart
      replays notifications missed within the 1h/1000 retention window
