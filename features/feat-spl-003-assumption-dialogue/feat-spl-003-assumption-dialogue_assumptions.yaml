      published exactly once.
    confidence: medium
    basis: >-
      JARVIS stream is limits-retention 1h/1000 (nats-infrastructure
      stream-definitions.json); the whole point of the feature is that these
      messages currently evaporate — an ephemeral NEW consumer would
      re-open a smaller version of the same hole across restarts.
    human_response: "overridden: ephemeral NEW consumer (DDR-027 pattern), NOT durable"
    human_rationale: >-
      Rich, 2026-07-07: these notifications are build/status updates — noisy,
      and a missed one is recoverable by asking Jarvis for current status. So
      restart-replay is low marginal value and not worth departing from the
      established DDR-027 ephemeral-NEW pattern (which also avoids the extra
      durable-consumer ops surface and redelivery-storm risk on the shared
      stream). Note: deliverable-1 (a consumer exists at all) is unchanged —
      only durable-vs-ephemeral flipped. No pinned scenario requires replay:
      "The thread mapping survives a Jarvis restart" tests post-restart
      threading (ephemeral-NEW satisfies it); nothing requires replaying
      messages published during downtime. PREMISE + REVISIT TRIGGER: this
