  - id: "ASSUM-004"
    scenario: "A decision prompt rendered before a restart remains fully decidable after it"
    assumption: >-
      The dialogue state store IS the Slack message: each click chat.updates
      the clicked item to show its disposition, and dispositions are
      re-derived on every interaction from the message carried inside the
      Slack interaction payload itself (payload["message"]) — Jarvis keeps
      NO pending-dialogue map. The aggregate response publishes when the
      final undecided item receives its decision. This makes partial
      decisions restart-survivable with zero jarvis-side persistence
      (ADR-ARCH-004), extending the JNB-105 "reply path has no pending map"
      design to the multi-item case.
    confidence: high
    basis: >-
      Slack block_actions payloads carry the full source message; the
      existing reply handler already operates map-free (DDR-027, JNB-105
      scenario 6); no other state location is ADR-ARCH-004-compliant
      jarvis-side.
    human_response: "confirmed"
    human_rationale: >-
      Reviewed as presented; the only ADR-ARCH-004-compliant option
      jarvis-side and a direct extension of the proven map-free reply path
      (DDR-027, JNB-105 s6). No override exists that isn't a re-opening of a
      frozen constraint.
    reviewed: "2026-07-07"

