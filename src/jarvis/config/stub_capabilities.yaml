version: "1.0"
capabilities:

  - agent_id: architect-agent
    role: Architect
    description: >
      Produces architecture sessions, C4 diagrams, and ADRs for features. Best
      for "design the system for X", "generate a C4 diagram", "review this
      architecture against the ADR set". Not for implementation.
    capability_list:
      - tool_name: run_architecture_session
        description: Drive a full /system-arch session from a scope document and emit ARCHITECTURE.md + ADRs.
        risk_level: read_only
        # NOTE: stub-only tool (no upstream specialist-agent manifest entry).
        # Parameters authored from the description for stub parity per
        # TASK-CAPS-PROMPT-001 / DDR-021 amendment. If this tool is ever
        # promoted to the live manifest, replace this block with the
        # upstream copy.
        parameters:
          type: object
          properties:
            scope_doc:
              type: string
              description: Path to the scope document driving the session.
            output_path:
              type: string
              description: Where to write ARCHITECTURE.md and ADR files.
          required:
            - scope_doc
      - tool_name: draft_adr
        description: Given a decision + context, emit a single ADR file.
        risk_level: mutating
        # NOTE: stub-only tool. See parameters note on run_architecture_session.
        parameters:
          type: object
          properties:
            title:
              type: string
              description: Short ADR title (becomes the file name slug).
            context:
              type: string
              description: Background and forces motivating the decision.
            decision:
              type: string
              description: The decision being recorded.
          required:
            - title
            - context
            - decision
      - tool_name: architect_greenfield
        description: Drive a greenfield architecture session for a new feature scope.
        risk_level: read_only
        # Source: specialist-agent/.../adapters/manifest.py
        # _architect_manifest_factory — architect_greenfield.
        parameters:
          type: object
          properties:
            docs_path:
              type: string
              description: Path to product documentation directory
            scope:
              type: string
              description: Scoping brief — what to include/exclude
            output_path:
              type: string
              description: Where to write the conversation starter
          required:
            - docs_path
            - scope
      - tool_name: architect_align
        description: Align an existing design against the ADR set; emit an AlignmentJudgment.
        risk_level: read_only
        # Source: specialist-agent/.../adapters/manifest.py
        # _architect_manifest_factory — architect_align. THIS IS THE TOOL
        # THE 2026-05-16 DEMO DISPATCHES TO; the live manifest's required
        # keys (context/proposal/question) MUST match this stub block
        # exactly so the supervisor constructs the right payload across
        # the live↔stub swap.
        parameters:
          type: object
          properties:
            context:
              type: string
              description: "Background: existing architecture, constraints"
            proposal:
              type: string
              description: The proposal or design to evaluate
            question:
              type: string
              description: Specific question to answer
          required:
            - context
            - proposal
            - question
      - tool_name: architect_explore
        description: Explore design alternatives for an open architectural question.
        risk_level: read_only
        # Source: specialist-agent/.../adapters/manifest.py
        # _architect_manifest_factory — architect_explore.
        parameters:
          type: object
          properties:
            codebase_path:
              type: string
              description: Path to codebase root directory
            architecture_path:
              type: string
              description: Path to ARCHITECTURE.md or C4 docs
            query:
              type: string
              description: "Analysis focus: 'drift check', 'boundary review', or specific question"
          required:
            - codebase_path
            - architecture_path
            - query
      - tool_name: architect_feasibility
        description: Assess feasibility of a proposed approach against current constraints.
        risk_level: read_only
        # Source: specialist-agent/.../adapters/manifest.py
        # _architect_manifest_factory — architect_feasibility.
        parameters:
          type: object
          properties:
            idea_summary:
              type: string
              description: Short description of the product idea
            constraints:
              type: array
              items:
                type: string
              description: Technical or business constraints (e.g. latency, integration requirements)
            existing_architecture:
              type: string
              description: Current ARCHITECTURE.md content or summary
          required:
            - idea_summary
    cost_signal: "moderate (~$0.50-$2 per session)"
    latency_signal: "5-30 minutes per session"
    last_heartbeat_at: null
    trust_tier: specialist

  - agent_id: gcse-tutor
    role: GCSE Tutor
    description: >
      Interactive GCSE-level tutoring sessions across English Literature, English
      Language, Maths, Sciences, History, and other secondary-school subjects.
      Uses Socratic dialogue scaffolded against AO1/AO2/AO3/AO4 assessment
      objectives. Best for "tutor me on", "GCSE revision", "explain this passage",
      "walk me through this poem/equation/concept", and any learner-style
      coaching exchange at GCSE level. Multi-turn — start a session, take
      turns, end the session. Not for adult/academic-level research.
    capability_list:
      - tool_name: tutor_start_session
        description: >-
          Start an interactive GCSE-level tutoring session. Covers English
          Literature, English Language, Maths, Sciences, History, and other
          GCSE subjects using Socratic dialogue scaffolded against
          AO1/AO2/AO3/AO4 assessment objectives. Use whenever a learner asks
          for tutoring, revision, or subject-specific coaching at GCSE level.
          Sync; returns session_id immediately; LLM model is warmed up in the
          background as fire-and-forget. Topic and player_model are optional
          overrides.
        risk_level: mutating
        # Source: study-tutor/src/study_tutor/adapters/manifest.py
        # _TUTOR_TOOLS[0] tutor_start_session. Parameters mirrored
        # byte-equivalent per TASK-DSR-005 AC-DSR-005-02 (same contract as
        # TASK-DSR-001 enforced for architect tools).
        parameters:
          type: object
          properties:
            student_id:
              type: string
              description: >-
                Stable learner identifier (e.g. "lilymay" or "gcse-user-001").
                If the caller has no learner ID in context (e.g. an OpenWebUI
                session without a logged-in learner profile), use a plausible
                placeholder such as "openwebui-learner" or "gcse-user-001"
                — gcse-tutor does NOT require the learner to be pre-registered.
                Do not ask the user for this; pick a sensible default.
            topic_override:
              type: string
              description: >-
                Optional override for the planned topic; defaults to the
                student's current curriculum step.
            player_model:
              type: string
              description: "Optional LLM model override (e.g. for A/B experiments)."
          required:
            - student_id
      - tool_name: tutor_turn
        description: >-
          Take one teaching turn in an active GCSE tutoring session. Submits
          the learner's response and returns a Socratic coaching reply that
          scaffolds the learner toward grade-level analysis using AO1 (text
          knowledge), AO2 (language and structure), and where appropriate AO3
          (context) and AO4 (comparison). Use after tutor_start_session
          whenever the learner sends a new response in an ongoing English
          Literature, English Language, Maths, Sciences, or History tutoring
          exchange. Sync, typically returns within 15s.
        risk_level: mutating
        # Source: study-tutor/.../manifest.py _TUTOR_TOOLS[1] tutor_turn.
        parameters:
          type: object
          properties:
            session_id:
              type: string
              description: "Session identifier from tutor_start_session."
            user_message:
              type: string
              description: "The learner's message for this turn."
            player_model:
              type: string
              description: "Optional LLM model override for this turn."
          required:
            - session_id
            - user_message
      - tool_name: tutor_session_status
        description: >-
          Check the current state of an active GCSE tutoring session — turn
          count, current plan step, coaching progress, and AO coverage so
          far. Use to verify a session is healthy before submitting more
          learner responses. Sync; read-only; returns current session state
          for the given session_id.
        risk_level: read_only
        # Source: study-tutor/.../manifest.py _TUTOR_TOOLS[2] tutor_session_status.
        parameters:
          type: object
          properties:
            session_id:
              type: string
              description: "Session identifier."
          required:
            - session_id
      - tool_name: tutor_session_end
        description: >-
          End an active GCSE tutoring session — captures a final session
          summary covering AO1/AO2/AO3/AO4 progress and releases planner/LLM
          resources. Use when a learner indicates they are finished revising
          or want to wrap up the English Literature, Maths, or other GCSE
          subject tutoring exchange. Sync; mutating; marks the session ended
          and releases resources.
        risk_level: mutating
        # Source: study-tutor/.../manifest.py _TUTOR_TOOLS[3] tutor_session_end.
        parameters:
          type: object
          properties:
            session_id:
              type: string
              description: "Session identifier."
          required:
            - session_id
    cost_signal: "low (~$0.10/turn — local llama-swap gemma4-tutor)"
    latency_signal: "10-30s per turn"
    last_heartbeat_at: null
    trust_tier: specialist

  - agent_id: product-owner-agent
    role: Product Owner
    description: >
      Reviews feature specifications, prioritises work, and refines acceptance
      criteria. Best for "is this spec complete?", "what's missing from this
      feature?", "should we build X or Y first?". Not for architectural
      decisions.
    capability_list:
      - tool_name: review_specification
        description: Evaluate a feature spec for completeness, clarity, and priority.
        risk_level: read_only
        # NOTE: stub-only tool (no upstream specialist-agent manifest entry).
        # Parameters authored for stub parity per TASK-CAPS-PROMPT-001.
        parameters:
          type: object
          properties:
            spec_path:
              type: string
              description: Path to the feature specification document.
            focus:
              type: string
              description: "Optional review focus area — e.g. 'completeness', 'priority', 'risks'."
          required:
            - spec_path
      - tool_name: refine_acceptance_criteria
        description: Expand or tighten the Given/When/Then scenarios in a feature spec.
        risk_level: mutating
        # NOTE: stub-only tool. See parameters note on review_specification.
        parameters:
          type: object
          properties:
            spec_path:
              type: string
              description: Path to the feature specification document to refine.
            scenario_id:
              type: string
              description: Optional scenario identifier to scope refinement to a single scenario.
          required:
            - spec_path
    cost_signal: "low (~$0.10/call)"
    latency_signal: "30s-2min"
    last_heartbeat_at: null
    trust_tier: specialist

  - agent_id: ideation-agent
    role: Ideation
    description: >
      Generates candidate solutions, alternatives, and counter-examples. Best
      for "what are our options here?", "steelman the opposing view", "what
      could go wrong?". Not for committing to a decision — delegate that back
      to Rich or to the architect.
    capability_list:
      - tool_name: generate_alternatives
        description: Produce 3-5 distinct candidate approaches to a stated problem.
        risk_level: read_only
        # NOTE: stub-only tool — no upstream specialist-agent manifest entry.
        # Parameters authored for stub parity per TASK-CAPS-PROMPT-001.
        parameters:
          type: object
          properties:
            problem:
              type: string
              description: The problem statement to generate alternatives for.
            constraints:
              type: array
              items:
                type: string
              description: Optional constraints that candidate alternatives must respect.
          required:
            - problem
      - tool_name: steelman
        description: Construct the strongest possible argument for the opposing position.
        risk_level: read_only
        # NOTE: stub-only tool. See parameters note on generate_alternatives.
        parameters:
          type: object
          properties:
            position:
              type: string
              description: The position to construct a steelman argument for.
            audience:
              type: string
              description: Optional audience descriptor — shapes the rhetorical register.
          required:
            - position
    cost_signal: "low (~$0.05/call)"
    latency_signal: "10-30s"
    last_heartbeat_at: null
    trust_tier: specialist

  - agent_id: forge
    role: Build Pipeline
    description: >
      Executes feature builds end-to-end given a feature YAML. Consumes
      pipeline.build-queued.{feature_id} from JetStream. Jarvis queues; Forge
      does the work. Fire-and-forget — progress events arrive via
      notifications, not by awaiting this dispatch.
    capability_list:
      - tool_name: build_feature
        description: >
          Synonym surfacing the queue_build tool's semantics into the catalogue so the
          reasoning model can reason about "Forge" as a dispatch target
          alongside specialist agents. In practice the reasoning model will
          invoke the dedicated queue_build tool rather than dispatch_by_capability.
        risk_level: mutating
        # NOTE: synthetic synonym — dispatched in practice via queue_build,
        # not dispatch_by_capability. Parameters authored for stub parity
        # per TASK-CAPS-PROMPT-001 so the prompt block carries the same
        # shape as live tools even though this entry is documentation.
        parameters:
          type: object
          properties:
            feature_id:
              type: string
              description: The feature identifier to build (e.g. FEAT-XXX-NNN).
            feature_yaml_path:
              type: string
              description: Path to the feature YAML driving the build.
          required:
            - feature_id
    cost_signal: "high (full GuardKit AutoBuild run)"
    latency_signal: "15-180min"
    last_heartbeat_at: null
    trust_tier: core
