id: FEAT-SPL-003
name: Assumption Dialogue (jarvis half)
description: >-
  Jarvis's half of the Sovereign Planning Loop assumption dialogue. (1) A
  jarvis.notification.slack return-channel consumer (ephemeral NEW, manual-ack,
  thread render, graceful top-level degrade — never dropped). (2) Per-assumption
  Block Kit decision prompts (forced per-item approve/edit/defer, no mega-Approve)
  rendered directly from the plan-{cid} ApprovalRequestPayload.details, with the
  binary build-paused mirror suppressed; aggregate ApprovalResponsePayload carrying
  the structured nats-core 0.6.0 dispositions field. jarvis holds zero mapping state
  (DD-SPL003-1 round-trip); no reasoning — render and capture only.
